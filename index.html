<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my CUTIEEEEE</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #800020; text-align: center; padding: 30px; color: #333; }
        .container { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: inline-block; max-width: 90%; width: 400px; }
        textarea { width: 90%; height: 70px; padding: 10px; border-radius: 8px; border: 1px solid #ffb3b3; font-size: 16px; resize: none; margin-bottom: 10px; }
        .file-input-label { display: block; background: #fff5f5; border: 2px dashed #ff4d4d; padding: 10px; border-radius: 8px; cursor: pointer; margin: 10px 0; font-weight: bold; color: #ff4d4d; }
        .file-input-label:hover { background: #ffe6e6; }
        input[type="file"] { display: none; }
        button { background-color: #ff4d4d; color: white; border: none; padding: 12px 25px; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 10px; width: 100%; font-weight: bold; }
        button:hover { background-color: #ff1a1a; }
        #preview { max-width: 128px; max-height: 64px; margin-top: 10px; border: 1px solid #ccc; image-rendering: pixelated; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>send me smthhhhhhh :33333</h2>
    <textarea id="messageInput" placeholder="type a message..."></textarea>
    
    <label class="file-input-label">
        add your beautiful face :3
        <input type="file" id="imageInput" accept="image/*" onchange="processImage()">
    </label>
    <canvas id="preview"></canvas>
    
    <button onclick="sendMessage()">SENDDD&lt;33</button>
    <p id="status" style="color: green; font-weight: bold; margin-top: 15px;"></p>
</div>

<script>
    const espURL = "https://ournote-14204-default-rtdb.firebaseio.com/current_message.json";
    const logURL = "https://ournote-14204-default-rtdb.firebaseio.com/history_logs.json";
    let hexImageString = ""; 

    function processImage() {
        const file = document.getElementById('imageInput').files[0];
        if (!file) return;

        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = function() {
            const canvas = document.getElementById('preview');
            const ctx = canvas.getContext('2d');
            
            canvas.width = 128;
            canvas.height = 64;
            
            let scale = Math.max(128 / img.width, 64 / img.height);
            let x = (128 / 2) - (img.width / 2) * scale;
            let y = (64 / 2) - (img.height / 2) * scale;
            ctx.drawImage(img, x, y, img.width * scale, img.height * scale);
            
            const imgData = ctx.getImageData(0, 0, 128, 64);
            const data = imgData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                let gray = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
                data[i] = data[i+1] = data[i+2] = gray;
            }
            
            for (let y = 0; y < 64; y++) {
                for (let x = 0; x < 128; x++) {
                    let idx = (y * 128 + x) * 4;
                    let oldPart = data[idx];
                    let newPart = oldPart < 128 ? 0 : 255;
                    data[idx] = data[idx+1] = data[idx+2] = newPart;
                    let err = oldPart - newPart;
                    
                    if (x + 1 < 128) data[idx + 4] += err * 7 / 16;
                    if (y + 1 < 64) {
                        if (x > 0) data[idx + 128 * 4 - 4] += err * 3 / 16;
                        data[idx + 128 * 4] += err * 5 / 16;
                        if (x + 1 < 128) data[idx + 128 * 4 + 4] += err * 1 / 16;
                    }
                }
            }
            ctx.putImageData(imgData, 0, 0);
            canvas.style.display = "inline-block";

            let byteArray = new Uint8Array(1024);
            for (let i = 0; i < 1024; i++) {
                let byteVal = 0;
                for (let bit = 0; bit < 8; bit++) {
                    let pixelIndex = (i * 8) + bit;
                    let pX = pixelIndex % 128;
                    let pY = Math.floor(pixelIndex / 128);
                    let dataIdx = (pY * 128 + pX) * 4;
                    if (data[dataIdx] > 127) {
                        byteVal |= (1 << (7 - bit)); 
                    }
                }
                byteArray[i] = byteVal;
            }
            
            hexImageString = Array.from(byteArray).map(b => b.toString(16).padStart(2, '0')).join(',');
        };
    }

    function sendMessage() {
        const text = document.getElementById("messageInput").value;
        const status = document.getElementById("status");

        if(!text && !hexImageString) { alert("Type a message or select a pic first!"); return; }
        status.innerText = "sending code to himm <3333";

        const now = new Date();
        const timestamp = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const dateStamp = now.toLocaleDateString(); 

        const dataToSend = {
            text: text,
            time: timestamp,
            date: dateStamp,
            image_data: hexImageString || "null"
        };

        const sendToESP = fetch(espURL, { method: "PUT", body: JSON.stringify(dataToSend) });
        const sendToLogs = fetch(logURL, { method: "POST", body: JSON.stringify(dataToSend) });

        Promise.all([sendToESP, sendToLogs])
        .then(responses => {
            if(responses[0].ok && responses[1].ok) {
                status.innerText = "he got itt :33";
                document.getElementById("messageInput").value = "";
                document.getElementById('imageInput').value = "";
                document.getElementById('preview').style.display = "none";
                hexImageString = ""; 
            } else {
                status.innerText = "something went wrong...";
            }
        }).catch(err => status.innerText = "Error: " + err);
    }
</script>
</body>
</html>

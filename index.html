<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my CUTIEEEEE</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #ffe6e6; text-align: center; padding: 50px; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: inline-block; }
        textarea { width: 80%; height: 80px; padding: 10px; border-radius: 8px; border: 1px solid #ffb3b3; font-size: 16px; resize: none; }
        button { background-color: #ff4d4d; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 15px; }
        button:hover { background-color: #ff1a1a; }
    </style>
</head>
<body>

<div class="container">
    <h2>send me smthhhhhhh :33333</h2>
    <textarea id="messageInput" placeholder="type smth you wanna tell me :3"></textarea><br>
    <button onclick="sendMessage()">SENDDD&lt;33</button>
    <p id="status" style="color: green; font-weight: bold;"></p>
</div>

<script>
    const firebaseURL = "https://ournote-14204-default-rtdb.firebaseio.com/message.json";

    function sendMessage() {
        const text = document.getElementById("messageInput").value;
        const status = document.getElementById("status");

        if(!text) { alert("type something first bru"); return; }

        status.innerText = "sending it to himm <3333";

        fetch(firebaseURL, {
            method: "PUT",
            body: JSON.stringify(text)
        })
        .then(response => {
            if(response.ok) {
                status.innerText = "he got itt :33";
                document.getElementById("messageInput").value = "";
            } else {
                status.innerText = "smth fucked up hold on";
            }
        })
        .catch(err => status.innerText = "Error: " + err);
    }
</script>

</body>
</html>

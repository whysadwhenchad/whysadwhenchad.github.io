<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my CUTIEEEEE</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #800020; text-align: center; padding: 30px; color: #333; }
        .container { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: inline-block; max-width: 90%; width: 400px; }
        textarea { width: 90%; height: 70px; padding: 10px; border-radius: 8px; border: 1px solid #ffb3b3; font-size: 16px; resize: none; margin-bottom: 10px; }
        .file-input-label, .record-btn { display: block; background: #fff5f5; border: 2px dashed #ff4d4d; padding: 10px; border-radius: 8px; cursor: pointer; margin: 10px 0; font-weight: bold; color: #ff4d4d; user-select: none; }
        .file-input-label:hover { background: #ffe6e6; }
        .record-btn:active, .record-btn.recording { background: #ff4d4d; color: white; border-style: solid; }
        input[type="file"] { display: none; }
        button.send-btn { background-color: #ff4d4d; color: white; border: none; padding: 12px 25px; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 10px; width: 100%; font-weight: bold; }
        button.send-btn:hover { background-color: #ff1a1a; }
        #preview { max-width: 128px; max-height: 64px; margin-top: 10px; border: 1px solid #ccc; image-rendering: pixelated; display: none; }
        #audioStatus { font-size: 12px; color: #555; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>send me smthhhhhhh :33333</h2>
    <textarea id="messageInput" placeholder="type a message..."></textarea>
    
    <label class="file-input-label">
        add your beautiful face :3
        <input type="file" id="imageInput" accept="image/*" onchange="processImage()">
    </label>
    <canvas id="preview"></canvas>

    <div id="recordBtn" class="record-btn">hold to record voice :3 </div>
    <div id="audioStatus">No voice note attached</div>
    
    <button class="send-btn" onclick="sendMessage()">SENDDD&lt;33</button>
    <p id="status" style="color: green; font-weight: bold; margin-top: 15px;"></p>
</div>

<script>
    const espURL = "https://ournote-14204-default-rtdb.firebaseio.com/current_message.json";
    const voiceURL = "https://ournote-14204-default-rtdb.firebaseio.com/current_voice.json";
    const logURL = "https://ournote-14204-default-rtdb.firebaseio.com/history_logs.json";
    
    let hexImageString = ""; 
    let base64AudioString = ""; 

    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;
    let recordTimeout;

    const recordBtn = document.getElementById('recordBtn');
    const audioStatus = document.getElementById('audioStatus');

    async function startRecording() {
        if(isRecording) return;
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = processAudio;

            mediaRecorder.start();
            isRecording = true;
            recordBtn.classList.add('recording');
            recordBtn.innerText = "🔴 recording... let go to stop";
            
            // Auto stop after 3.7 seconds to protect ESP32 RAM limit
            recordTimeout = setTimeout(() => stopRecording(), 3700);
        } catch (err) { alert("Mic access denied!"); }
    }

    function stopRecording() {
        if(!isRecording) return;
        clearTimeout(recordTimeout);
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(t => t.stop()); 
        isRecording = false;
        recordBtn.classList.remove('recording');
        recordBtn.innerText = "🎤 hold to record voice (up to 3.7s)";
    }

    async function processAudio() {
        audioStatus.innerText = "processing audio...";
        const blob = new Blob(audioChunks);
        const arrayBuffer = await blob.arrayBuffer();
        
        // Upgraded to 16,000 Hz HD Voice!
        const ctx = new AudioContext({ sampleRate: 16000 });
        const audioBuffer = await ctx.decodeAudioData(arrayBuffer);
        const float32Data = audioBuffer.getChannelData(0); 
        
        const pcm8 = new Uint8Array(float32Data.length);
        for(let i = 0; i < float32Data.length; i++) {
            let val = Math.max(-1, Math.min(1, float32Data[i]));
            pcm8[i] = Math.round((val + 1) * 127.5);
        }
        
        let binary = '';
        for (let i = 0; i < pcm8.byteLength; i++) {
            binary += String.fromCharCode(pcm8[i]);
        }
        base64AudioString = window.btoa(binary);
        audioStatus.innerText = "✅ HD Voice note attached!";
    }

    recordBtn.addEventListener('mousedown', startRecording);
    recordBtn.addEventListener('mouseup', stopRecording);
    recordBtn.addEventListener('mouseleave', stopRecording);
    recordBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
    recordBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); });

    function processImage() {
        const file = document.getElementById('imageInput').files[0];
        if (!file) return;

        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = function() {
            const canvas = document.getElementById('preview');
            const ctx = canvas.getContext('2d');
            canvas.width = 128; canvas.height = 64;
            let scale = Math.max(128 / img.width, 64 / img.height);
            let x = (128 / 2) - (img.width / 2) * scale;
            let y = (64 / 2) - (img.height / 2) * scale;
            ctx.drawImage(img, x, y, img.width * scale, img.height * scale);
            
            const imgData = ctx.getImageData(0, 0, 128, 64);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                let gray = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
                data[i] = data[i+1] = data[i+2] = gray;
            }
            for (let y = 0; y < 64; y++) {
                for (let x = 0; x < 128; x++) {
                    let idx = (y * 128 + x) * 4;
                    let oldPart = data[idx]; let newPart = oldPart < 128 ? 0 : 255;
                    data[idx] = data[idx+1] = data[idx+2] = newPart;
                    let err = oldPart - newPart;
                    if (x + 1 < 128) data[idx + 4] += err * 7 / 16;
                    if (y + 1 < 64) {
                        if (x > 0) data[idx + 128 * 4 - 4] += err * 3 / 16;
                        data[idx + 128 * 4] += err * 5 / 16;
                        if (x + 1 < 128) data[idx + 128 * 4 + 4] += err * 1 / 16;
                    }
                }
            }
            ctx.putImageData(imgData, 0, 0); canvas.style.display = "inline-block";

            let byteArray = new Uint8Array(1024);
            for (let i = 0; i < 1024; i++) {
                let byteVal = 0;
                for (let bit = 0; bit < 8; bit++) {
                    let pixelIndex = (i * 8) + bit; let pX = pixelIndex % 128; let pY = Math.floor(pixelIndex / 128);
                    if (data[(pY * 128 + pX) * 4] > 127) byteVal |= (1 << (7 - bit)); 
                }
                byteArray[i] = byteVal;
            }
            hexImageString = Array.from(byteArray).map(b => b.toString(16).padStart(2, '0')).join(',');
        };
    }

    function sendMessage() {
        const text = document.getElementById("messageInput").value;
        const status = document.getElementById("status");

        if(!text && !hexImageString && !base64AudioString) { 
            alert("Send at least some text, a pic, or a voice note!"); return; 
        }
        
        status.innerText = "sending it to himm <3333";

        const now = new Date();
        const timestamp = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const dateStamp = now.toLocaleDateString(); 

        const dataToSend = {
            text: text,
            time: timestamp,
            date: dateStamp,
            image_data: hexImageString || "null",
            has_voice: base64AudioString !== "" 
        };

        const audioToSend = base64AudioString || "null";

        const sendToESP = fetch(espURL, { method: "PUT", body: JSON.stringify(dataToSend) });
        const sendVoice = fetch(voiceURL, { method: "PUT", body: JSON.stringify(audioToSend) });
        const sendToLogs = fetch(logURL, { method: "POST", body: JSON.stringify(dataToSend) }); 

        Promise.all([sendToESP, sendVoice, sendToLogs]).then(responses => {
            if(responses[0].ok && responses[1].ok) {
                status.innerText = "he got itt :33";
                document.getElementById("messageInput").value = "";
                document.getElementById('imageInput').value = "";
                document.getElementById('preview').style.display = "none";
                audioStatus.innerText = "No voice note attached";
                hexImageString = ""; 
                base64AudioString = ""; 
            } else { status.innerText = "something went wrong..."; }
        }).catch(err => status.innerText = "Error: " + err);
    }
</script>
</body>
</html>
